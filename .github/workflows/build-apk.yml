name: Compilar APK e Criar Release NoteS6Lite

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Gradle 8.7 na Nuvem
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Compilar o Aplicativo Oficial Otimizado (.APK)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 5. Renomear APK com Versao
        id: prep
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          if [ -z "$VERSION" ]; then VERSION="1.0"; fi
          APK_NAME="NoteS6Lite-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: 6. Disponibilizar APK como Artefato (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NoteS6Lite-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: 7. Publicar Release Oficial no GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NoteS6Lite v${{ steps.prep.outputs.version }}
          files: ${{ steps.prep.outputs.apk_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
