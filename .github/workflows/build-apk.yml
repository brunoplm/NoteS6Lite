name: Compilar APK NoteS6Lite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Configurar Gradle 8.7 na Nuvem
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Compilar o Aplicativo (.APK)
        run: gradle assembleDebug --no-daemon

      - name: 6. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: NoteS6Lite-Instalador-APK
          path: app/build/outputs/apk/debug/app-debug.apk
